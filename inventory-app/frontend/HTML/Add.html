<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add</title>
</head>
<body>
  <form id="form">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" placeholder="Enter name" required>
    <select name="type" id="type" title="type">
      <option value="Drinks">Drinks</option>
      <option value="Junk Foods">Junk Foods</option>
      <option value="Ice">Ice</option>
    </select>
    <label for="price">Price:</label>
    <input type="number" id="price" name="price" placeholder="Enter price" required>
    <label for="amount">Amount</label>
    <input type="text" id="amount" name="amount" placeholder="Enter amount" required>
    <select name="amount-type" id="amount-type" title="amount-type">
      <option value="pc">pc</option>
      <option value="box">box</option>
      <option value="kl">kl</option>
    </select>

    <input type="submit" value="Add Product" id="submit">
  </form>

  <label for="add-type">Add Type:</label>
  <input type="text" id="add-type" placeholder="Add type of product">
  <button id="addType">Add Type</button>

  <script type="module" src="../JS/add.js"></script>
</body>
</html>
