<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="screen" id="screen-container"><p id="screen"></p></div>
    <div class="buttons">
      <button id="del" onclick="Reset()">AC</button>
      <button id="back" onclick="Delete()"><div class="delete">x</div></button>
      <button id="conv" onclick="Convert()">+/-</button>
      <button id="divide" onclick="AddToScreen('÷')">÷</button>
      <button id="seven" onclick="AddToScreen(7)">7</button>
      <button id="eight" onclick="AddToScreen(8)">8</button>
      <button id="nine" onclick="AddToScreen(9)">9</button>
      <button id="times" onclick="AddToScreen('x')">x</button>
      <button id="four" onclick="AddToScreen(4)">4</button>
      <button id="five" onclick="AddToScreen(5)">5</button>
      <button id="six" onclick="AddToScreen(6)">6</button>
      <button id="minus" onclick="AddToScreen('-')">-</button>
      <button id="one" onclick="AddToScreen(1)">1</button>
      <button id="two" onclick="AddToScreen(2)">2</button>
      <button id="three" onclick="AddToScreen(3)">3</button>
      <button id="add" onclick="AddToScreen('+')">+</button>
      <button id="percent" onclick="AddToScreen('%')">%</button>
      <button id="zero" onclick="AddToScreen(0)">0</button>
      <button id="point" onclick="AddToScreen('.')">.</button>
      <button id="equal" onclick="Result()">=</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
