<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Management</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <button id="add" popovertarget="AddCard" popovertargetaction="show">Add</button>
  </header>

  <main class="container">
  </main>

  <section id="AddCard" popover="auto">
    <section class="data">
      <label for="productName">
        <input type="text" id="productName" name="productName" placeholder="Enter product name...">
      </label>
      <label for="price">
        <input type="number" name="price" id="price" placeholder="Enter price...">
      </label>
    </section>
    
    <section class="buttons">
      <button id="hide" popovertarget="AddCard" popovertargetaction="hide">Close</button>
      <button id="done">Done</button>
    </section>
  </section>

  <script src="script.js"></script>
</body>
</html>
